packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  # встроенный Postgres нужен только для локальной разработки на Mac
  '@embedded-postgres/linux-x64': false
  '@embedded-postgres/linux-arm64': false
